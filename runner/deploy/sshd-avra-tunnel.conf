# /etc/ssh/sshd_config.d/10-avra-tunnel.conf — installed by install-tunnel.sh
# (M4.4, separate approval). Restricts the avra-tunnel account to a single
# local port forward to the Runner. Complements the per-key options in
# authorized_keys (restrict, permitopen, from=, command=).
#
# Scope of this file (verified against OpenSSH 10.5p1 servconf.c):
# - It contains ONLY the Match block below — no global directives — so it
#   cannot change anything for other users even in principle.
# - sshd saves the Match state before an Include and restores it after
#   each included file ("Don't let included files clobber the containing
#   file's Match state"), so this block ends with this file; no trailing
#   "Match all" is needed.
# - Values from a matching Match block override global values; between
#   several matching blocks the first one read wins. The "10-" prefix makes
#   this file sort before typical drop-ins (20-systemd-userdb.conf, 50-…).
# install-tunnel.sh checks the effective settings with `sshd -T` and that
# every other user's effective configuration is byte-identical before and
# after this file is added, before sshd is reloaded.
#
# Deliberately NOT here: "AuthorizedKeysCommand none" — in OpenSSH 10.5 the
# value "none" is not treated as unset for this option (sshd would try to
# execute "none" and fail). AuthorizedKeysFile is pinned instead, and the
# restrictions below apply to the account whichever key source is used.
Match User avra-tunnel
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /var/lib/avra-tunnel/.ssh/authorized_keys
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8765
    PermitListen none
    GatewayPorts no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/sbin/nologin
